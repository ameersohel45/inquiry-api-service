name: PR Checks

on:
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Clone and build knowledge platform
        run: |
          git clone --branch ${{ secrets.CORE_RELEASE_TAG }} https://github.com/Sunbird-Knowlg/knowledge-platform.git
          cd knowledge-platform
          mvn clean install -DskipTests=true -DCLOUD_STORE_GROUP_ID=${{ secrets.CLOUD_STORE_GROUP_ID }} -DCLOUD_STORE_ARTIFACT_ID=${{ secrets.CLOUD_STORE_ARTIFACT_ID }} -DCLOUD_STORE_VERSION=${{ secrets.CLOUD_STORE_VERSION }} -Pknowlg-core

      - name: Build complete inquiry service
        run: mvn clean install -DskipTests=true

      - name: Run Tests (assessment-service only)
        working-directory: assessment-api/assessment-service
        run: mvn clean verify

      - name: Download JaCoCo CLI
        run: |
          curl -L -o jacoco-cli.zip https://github.com/jacoco/jacoco/releases/download/v0.8.10/jacoco-0.8.10.zip
          unzip jacoco-cli.zip -d jacoco-cli

      - name: Generate JaCoCo Coverage Report
        run: |
          java -jar jacoco-cli/lib/jacococli.jar report \
          assessment-api/assessment-service/target/jacoco.exec \
          --classfiles assessment-api/assessment-service/target/classes \
          --sourcefiles assessment-api/assessment-service/src/main/java \
          --xml assessment-api/assessment-service/target/site/jacoco/jacoco.xml

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: 'assessment-api/assessment-service/target/site/jacoco/jacoco.xml'

      - name: Publish Test Results to PR
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: assessment-api/assessment-service/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Fetch full history
        run: git fetch --unshallow

      - name: SonarCloud Scan
        run: mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751 -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} -Dsonar.organization=${{ secrets.SONAR_ORG }} -Dsonar.login=${{ secrets.SONAR_TOKEN }} -Dsonar.coverage.jacoco.xmlReportPaths=assessment-api/assessment-service/target/site/jacoco/jacoco.xml
        working-directory: assessment-api/assessment-service