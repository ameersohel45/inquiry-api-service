name: PR Checks

on:
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build complete inquiry service
        run: mvn clean install -DskipTests=true

      - name: Run Tests with JaCoCo Agent
        run: |
          java -javaagent:jacocoagent.jar=destfile=jacoco.exec -jar target/your-app.jar
        working-directory: assessment-api/assessment-service

      - name: Generate JaCoCo Coverage Report
        run: |
          java -jar jacococli.jar report jacoco.exec \
          --classfiles target/classes \
          --sourcefiles src/main/java \
          --html target/site/jacoco
        working-directory: assessment-api/assessment-service

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: assessment-api/assessment-service/target/site/jacoco/index.html

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: 'assessment-api/assessment-service/target/surefire-reports/*.xml'

      - name: Publish Test Results to PR
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: assessment-api/assessment-service/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: SonarCloud Scan
        run: mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} -Dsonar.organization=${{ secrets.SONAR_ORG }} -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        working-directory: assessment-api/assessment-service