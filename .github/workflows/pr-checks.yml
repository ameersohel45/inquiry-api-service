name: PR Checks

on:
  pull_request:
    branches:
      - '**'

jobs:
  test-and-analyze:
    name: Run Tests and Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Run tests
      run: mvn clean test
      
    - name: Run SonarQube analysis
      if: success()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn sonar:sonar \
          -Dsonar.projectKey=inquiry-api-service \
          -Dsonar.organization=ameersohel45 \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.scala.coverage.reportPaths=**/target/scala-*/scoverage-report/scoverage.xml \
          -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          **/target/surefire-reports/**/*.xml
          **/target/failsafe-reports/**/*.xml
          **/target/scala-*/scoverage-report/**/*
          **/target/site/jacoco/**/*
