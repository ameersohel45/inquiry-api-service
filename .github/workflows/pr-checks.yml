name: PR Checks

on:
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install yq
        run: sudo apt-get update && sudo apt-get install -y yq

      - name: Determine Knowledge Platform branch
        id: kp-branch
        run: |
          PR_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF##*/}}"
          MAPPED_BRANCH=$(yq ".\"$PR_BRANCH\"" knowlg-core-branch-mapping.yml)
          if [ "$MAPPED_BRANCH" = "null" ] || [ -z "$MAPPED_BRANCH" ]; then
            MAPPED_BRANCH="main"
          fi
          echo "branch=$MAPPED_BRANCH" >> $GITHUB_OUTPUT

      - name: Clone and build knowledge platform
        run: |
          git clone --branch ${{ steps.kp-branch.outputs.branch }} https://github.com/Sunbird-Knowlg/knowledge-platform.git
          cd knowledge-platform
          export SCALA_VERSION=2.12.11
          mvn clean install -DskipTests=true -Dscala.version=2.12.11 -DCLOUD_STORE_GROUP_ID=${{ secrets.CLOUD_STORE_GROUP_ID }} -DCLOUD_STORE_ARTIFACT_ID=${{ secrets.CLOUD_STORE_ARTIFACT_ID }} -DCLOUD_STORE_VERSION=${{ secrets.CLOUD_STORE_VERSION }} -Pknowlg-core

      - name: Build complete inquiry service
        run: mvn clean install -DskipTests=true

      - name: Run Tests (assessment-service only)
        working-directory: assessment-api/assessment-service
        run: mvn clean verify

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: 'assessment-api/assessment-service/target/surefire-reports/*.xml'

      - name: Publish Test Results to PR
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: assessment-api/assessment-service/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: SonarCloud Scan
        run: mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} -Dsonar.organization=${{ secrets.SONAR_ORG }} -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        working-directory: assessment-api/assessment-service